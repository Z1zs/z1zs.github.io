<script>
    $(document).ready(function () {
        var totalCitationElement = document.getElementById('total_cit');
        var citationElements = document.getElementsByClassName('show_paper_citations');

        if (!totalCitationElement && !citationElements.length) {
            return;
        }

        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/'
        {% endif %}

        $.getJSON(gsDataBaseUrl + 'gs_data.json')
            .done(function (data) {
                if (totalCitationElement) {
                    var totalCitation = Number(data && data.citedby);
                    totalCitationElement.textContent = Number.isFinite(totalCitation)
                        ? totalCitation.toLocaleString()
                        : 'unavailable';
                }

                Array.prototype.forEach.call(citationElements, function (element) {
                    var paperId = element.getAttribute('data');
                    var publication = data && data.publications && data.publications[paperId];
                    var numCitations = Number(publication && publication.num_citations);
                    element.textContent = Number.isFinite(numCitations)
                        ? '| Citations: ' + numCitations.toLocaleString()
                        : '| Citations: unavailable';
                });
            })
            .fail(function () {
                if (totalCitationElement) {
                    totalCitationElement.textContent = 'unavailable';
                }

                Array.prototype.forEach.call(citationElements, function (element) {
                    element.textContent = '| Citations: unavailable';
                });
            });
    });
</script>
